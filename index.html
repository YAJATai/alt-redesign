<div class="app">
  <div class="mobile-scrim" id="mobileScrim" hidden></div>
  <aside class="sidebar" id="sidebar" aria-label="Primary navigation"></aside>

  <div class="app-main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn mobile-menu" id="menuBtn" aria-label="Open navigation" aria-expanded="false" aria-controls="sidebar">
          <svg class="icon"><use href="#i-menu"/></svg>
        </button>
        <nav class="crumbs" aria-label="Breadcrumb">
          <a href="#/overview" class="crumb-brand">ALT.</a>
          <span class="crumb-sep">/</span>
          <span class="crumb-section" id="crumbSection">Overview</span>
          <span class="crumb-tab" id="crumbTab"></span>
        </nav>
      </div>
      <div class="topbar-actions">
        <button class="command-trigger" id="commandBtn" aria-label="Search or jump to a feature">
          <svg class="icon"><use href="#i-search"/></svg>
          <span class="command-trigger-label">Search or jump to</span>
          <kbd>⌘K</kbd>
        </button>
        <div class="popover-wrap">
          <button class="icon-btn" id="notifBtn" aria-label="Notifications" aria-expanded="false" aria-haspopup="dialog">
            <svg class="icon"><use href="#i-bell"/></svg>
            <span class="notif-dot" id="notifDot"></span>
          </button>
          <div class="popover notifications-popover" id="notifPopover" role="dialog" aria-label="Notifications" hidden></div>
        </div>
        <a class="avatar-link" href="#/usage/preferences" aria-label="Account preferences">
          <span class="avatar" id="topAvatar">Y</span>
        </a>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1">
      <div class="page" aria-busy="true">
        <div class="skeleton skeleton-heading"></div>
        <div class="skeleton skeleton-sub"></div>
        <div class="stats-grid skeleton-stats">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
        <div class="skeleton skeleton-panel"></div>
      </div>
    </main>
  </div>
